<div class="flex gap-3 mb-4 chat-bubble-enter {% if role == 'user' %}justify-end{% else %}justify-start{% endif %}">
  {% if role != 'user' %}
  <div class="w-8 h-8 rounded-full bg-brand-600 flex-shrink-0 flex items-center justify-center text-white text-xs font-bold shadow-sm">
    IA
  </div>
  {% endif %}

  <div class="max-w-[85%] md:max-w-[75%] rounded-2xl p-4 text-sm leading-relaxed shadow-sm
    {% if role == 'user' %}
      bg-brand-600 text-white rounded-br-none
    {% else %}
      bg-white text-slate-800 border border-slate-200/80 rounded-bl-none prose prose-sm prose-slate max-w-none
    {% endif %}">
    {{ content | safe }}
  </div>

  {% if role == 'user' %}
  <div class="w-8 h-8 rounded-full bg-slate-300 flex-shrink-0 flex items-center justify-center text-slate-700 text-xs font-bold">
    Você
  </div>
  {% endif %}
</div>
