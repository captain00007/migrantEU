<div id="subscribe-container" class="bg-gradient-to-br from-brand-900 via-indigo-950 to-slate-900 rounded-3xl p-8 sm:p-10 text-white shadow-xl relative overflow-hidden">
  <div class="relative z-10 max-w-2xl">
    <span class="inline-block px-3 py-1 rounded-full bg-brand-500/20 text-brand-300 text-xs font-bold uppercase tracking-wider mb-4 border border-brand-400/20">
      Alertas em Tempo Real
    </span>
    <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight mb-3">
      Receba novos editais no seu e-mail
    </h2>
    <p class="text-slate-300 text-sm leading-relaxed mb-6">
      Não perca prazos de inscrição. Escolha seus tópicos de interesse e avisaremos assim que um novo edital for aprovado por nossa equipe.
    </p>

    <form hx-post="/api/subscribers" hx-target="#subscribe-container" hx-swap="outerHTML" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Áreas de Interesse:</label>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
          <label class="flex items-center gap-2 p-2 rounded-lg bg-white/10 hover:bg-white/15 cursor-pointer transition-colors border border-white/5">
            <input type="checkbox" name="topics" value="ensino_superior" checked class="rounded text-brand-500 focus:ring-brand-400">
            <span>Universidade</span>
          </label>
          <label class="flex items-center gap-2 p-2 rounded-lg bg-white/10 hover:bg-white/15 cursor-pointer transition-colors border border-white/5">
            <input type="checkbox" name="topics" value="curso_portugues" checked class="rounded text-brand-500 focus:ring-brand-400">
            <span>Português</span>
          </label>
          <label class="flex items-center gap-2 p-2 rounded-lg bg-white/10 hover:bg-white/15 cursor-pointer transition-colors border border-white/5">
            <input type="checkbox" name="topics" value="acolhimento_social" class="rounded text-brand-500 focus:ring-brand-400">
            <span>Apoio Social</span>
          </label>
          <label class="flex items-center gap-2 p-2 rounded-lg bg-white/10 hover:bg-white/15 cursor-pointer transition-colors border border-white/5">
            <input type="checkbox" name="topics" value="pos_graduacao" class="rounded text-brand-500 focus:ring-brand-400">
            <span>Pós-Graduação</span>
          </label>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 pt-2">
        <input type="email" name="email" required placeholder="Digite seu melhor e-mail..."
          class="flex-1 px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:bg-white/20 transition-all">
        <button type="submit" class="px-6 py-3 rounded-xl bg-brand-500 hover:bg-brand-400 text-white font-bold text-sm transition-all shadow-lg shadow-brand-500/30 flex items-center justify-center gap-2">
          <span>Quero Receber Alertas</span>
        </button>
      </div>
      <p class="text-[11px] text-slate-400">Cancelamento gratuito a qualquer momento com 1 clique.</p>
    </form>
  </div>
</div>
