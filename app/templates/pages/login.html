{% extends "base.html" %}

{% block title %}Login Administrativo — migrantEU{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-20">
  <div class="bento-card rounded-3xl p-8 sm:p-10 shadow-xl border border-slate-200/90 bg-white/95">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-sky-500/25 mx-auto mb-3">
        mEU
      </div>
      <h1 class="text-2xl font-black text-slate-900">Acesso Restrito — Moderação</h1>
      <p class="text-xs text-slate-500 mt-1">Painel administrativo e aprovação de editais</p>
    </div>

    {% if error %}
    <div class="p-3.5 mb-5 rounded-xl bg-rose-50 text-rose-700 text-xs font-semibold border border-rose-200">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/login" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">E-mail de Acesso</label>
        <input type="email" name="email" required placeholder="admin@migranteu.org"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Senha</label>
        <input type="password" name="password" required placeholder="••••••••"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all">
      </div>
      <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-extrabold text-sm shadow-md shadow-sky-500/25 transition-all">
        Entrar no Painel
      </button>
    </form>
  </div>
</div>
{% endblock %}
