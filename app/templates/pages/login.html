{% extends "base.html" %}

{% block title %}Login Administrativo — migrantEU{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Acesso Restrito</h1>
      <p class="text-xs text-slate-500 mt-1">Painel de moderação de editais e configurações</p>
    </div>

    {% if error %}
    <div class="p-3 mb-4 rounded-lg bg-rose-50 text-rose-700 text-xs font-semibold border border-rose-200">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/login" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">E-mail Institucional</label>
        <input type="email" name="email" required placeholder="admin@migranteu.org"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Senha</label>
        <input type="password" name="password" required placeholder="••••••••"
          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-sm transition-all">
        Entrar no Painel
      </button>
    </form>
  </div>
</div>
{% endblock %}
